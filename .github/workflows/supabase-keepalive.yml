name: Supabase Keepalive

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase healthcheck table
        run: |
          curl -fsS \
            "${{ secrets.SUPABASE_URL }}/rest/v1/app_healthcheck?id=eq.1&select=id,name" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
