name: Supabase Keepalive

on:
  schedule:
    # External keepalive ping. Reads one harmless healthcheck row daily.
    # This does not change app data and does not write dummy rows repeatedly.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping app healthcheck row
    runs-on: ubuntu-latest
    steps:
      - name: Read Supabase healthcheck row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            "${SUPABASE_URL}/rest/v1/app_healthcheck?id=eq.1&select=id,name" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json"
